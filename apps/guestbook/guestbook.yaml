# --- SERVICE ACCOUNTS (Zero-Trust API Access) ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: production
automountServiceAccountToken: false
---
# --- REDIS BACKEND ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-backend
  namespace: production
  labels:
    app: redis-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-backend
  template:
    metadata:
      labels:
        app: redis-backend
    spec:
      serviceAccountName: redis-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        # Pinned to redis:7.0-alpine SHA
        image: redis@sha256:779bc94709cc594511dbbf3b934062086c8f9ee69a4746ecf0e1ea7c16cd6cf5
        command: ["redis-server", "--protected-mode", "no", "--dir", "/tmp"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
      volumes:
      - name: tmp-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-backend
  namespace: production
spec:
  selector:
    app: redis-backend
  ports:
  - port: 6379
    targetPort: 6379
---
# --- NGINX FRONTEND ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: production
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: guestbook-frontend
        # Pinned to nginxinc/nginx-unprivileged:alpine SHA
        image: nginxinc/nginx-unprivileged@sha256:8894df927ad3e4a9e403d64c1daffafcb985cbca3cb23d517c5bba33ccf03761
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        - name: run-dir
          mountPath: /var/run
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
      volumes:
      - name: tmp-dir
        emptyDir: {}
      - name: run-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 8080
---
# --- NETWORK POLICIES ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-redis
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: redis-backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-to-redis
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-backend
    ports:
    - protocol: TCP
      port: 6379
---
# CRITICAL FIX: Allow external traffic (e.g. Ingress Controller) to reach frontend pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-frontend
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {} # In a real environment, restrict this to Ingress Controller namespace
    ports:
    - protocol: TCP
      port: 8080
