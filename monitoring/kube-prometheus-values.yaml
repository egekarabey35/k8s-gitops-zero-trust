# Custom Helm values for kube-prometheus-stack
# Target: Zero-Trust Kubernetes Cluster Observability & FinOps Telemetry

fullnameOverride: "monitoring"

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  enabled: true
  adminPassword: "changeme-in-vault"
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

alertmanager:
  enabled: true
  alertmanagerSpec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
